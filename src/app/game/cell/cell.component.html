<div
  class="cell"
  [class.wall-top]="cell().wall.top"
  [class.wall-bottom]="cell().wall.bottom"
  [class.wall-left]="cell().wall.left"
  [class.wall-right]="cell().wall.right"
  [class.escape]="cell().isEscape"
>
  @if (cell().hasPlayer) {
    <div class="hunter" [class]="facingClass()"></div>
  }
</div>
